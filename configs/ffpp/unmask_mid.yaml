# UNMASK-Mid (FS-VFM ViT-S/16 + PE-Core-T/16, 28.2 M parameters at inference)
# trained on FF++ c23 with NeuralTextures held out (paper, Table 3).
#   python tools/train.py --config configs/ffpp/unmask_mid.yaml --output_dir runs/unmask_mid_ffpp
variant: mid

# data (FSFM pre-processing: 32 face crops per video)
train_path: data/FaceForensics++/c23/train
val_path: data/FaceForensics++/c23/val
holdout_manip: NeuralTextures   # excluded from training, kept as a validation compass
val_subsample: 0.35
select_by: heldout              # picks checkpoint-best.pth; the paper reports checkpoint-last.pth

# foundation prior of the face branch (tools/download_weights.py)
face_ckpt: pretrained/fsvfm_vit_small/FS-VFM_ViT-S_VF2_600e.pth
face_mean_std: pretrained/fsvfm_vit_small/pretrain_ds_mean_std.txt

# teachers (training only)
teacher_fsvfm: pretrained/fsvfm_vit_large_ffpp_c23.pth   # online, routed to the face branch
gend_cache: pretrained/gend_cache_ffpp_train.npz          # cached, routed to the CLIP branch
teacher_gate: 85

# recipe
epochs: 10
epoch_mult: 0.5          # one epoch = half a pass over the real frames (paired batches)
batch_size: 32
accum_iter: 2            # effective batch 64, lr = 1e-3 * 64 / 256 = 2.5e-4
blr: 0.001
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_targets: attn+mlp
branch_drop: 0.2
w_cls: 1.0
w_branch: 0.5
w_kd: 0.5
kd_temperature: 3.0
w_sfd: 1.0
w_dfd: 0.5
label_smoothing: 0.1
mix_prob: 0.5
init_seed: 0
seed: 0                  # the paper's three seeds: 0, 1, 2 (init_seed stays 0)
workers: 6
