# Ablation: UNMASK-Mid on HydraFake WITHOUT teachers (cross-entropy + auxiliary heads only),
# the "no teacher" row of the distillation ablation. Compare with unmask_mid.yaml.
#
# UNMASK-Mid trained on the HydraFake training split (paper, Table 4; protocol of
# Tan et al., ICLR 2026). Same recipe as on FF++; only the data and the schedule change:
# 10 epochs, each one full pass over HydraFake train, without real/fake pairing.
#   python tools/train.py --config configs/hydrafake/unmask_mid_no_kd.yaml --output_dir runs/unmask_mid_hydrafake_no_kd
variant: mid

train_path: data/HydraFake/train
val_path: data/HydraFake/val
holdout_manip: none
val_subsample: 1.0
no_pairing: true
select_by: clean

face_ckpt: pretrained/fsvfm_vit_small/FS-VFM_ViT-S_VF2_600e.pth
face_mean_std: pretrained/fsvfm_vit_small/pretrain_ds_mean_std.txt

# no teachers
teacher_fsvfm: null
gend_cache: null

epochs: 10
batch_size: 32
accum_iter: 2
blr: 0.001
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_targets: attn+mlp
branch_drop: 0.2
w_cls: 1.0
w_branch: 0.5
w_kd: 0.5
kd_temperature: 3.0
w_sfd: 1.0
w_dfd: 0.5
label_smoothing: 0.1
mix_prob: 0.5
init_seed: 0
seed: 0
workers: 6
